name: "Skenario 1 - Level 3 - Deploy Flask (release + cron)"

# Trigger:
# 1. Push tag v*
# 2. Cron setiap hari jam 02:00 UTC
# 3. Bisa dijalankan manual dari GitHub Actions
on:
  push:
    tags:
      - 'v*'

  schedule:
    - cron: '0 2 * * *'

  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Flask app ke VM-A
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. Checkout repository
      # ==========================================
      - name: Checkout kode
        uses: actions/checkout@v4


      # ==========================================
      # 2. Tentukan versi release
      # ==========================================
      - name: Tentukan versi rilis
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "version=scheduled-refresh" >> "$GITHUB_OUTPUT"
          fi


      # ==========================================
      # 3. Install Cloudflared dan sshpass
      # ==========================================
      - name: Install cloudflared & sshpass
        run: |
          curl -L \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb \
            -o cloudflared.deb

          sudo dpkg -i cloudflared.deb

          sudo apt-get update -y
          sudo apt-get install -y sshpass


      # ==========================================
      # 4. Konfigurasi SSH melalui Cloudflare
      # ==========================================
      - name: Siapkan SSH config Cloudflare Access
        env:
          CF_ACCESS_HOSTNAME: ${{ secrets.URL_VM }}
          VPS_USERNAME: ${{ secrets.USER_VPS }}

        run: |
          mkdir -p ~/.ssh

          cat > ~/.ssh/config <<EOC
          Host vm-a
            HostName ${CF_ACCESS_HOSTNAME}
            User ${VPS_USERNAME}
            ProxyCommand cloudflared access ssh --hostname %h
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            PubkeyAuthentication no
          EOC

          chmod 600 ~/.ssh/config


      # ==========================================
      # 5. Test koneksi SSH
      # ==========================================
      - name: Test koneksi SSH ke VM-A
        env:
          SSHPASS: ${{ secrets.PASS_VPS }}

        run: |
          sshpass -e ssh \
            -o StrictHostKeyChecking=no \
            -o PubkeyAuthentication=no \
            vm-a \
            "echo 'SSH ke VM-A berhasil'"


      # ==========================================
      # 6. Siapkan folder aplikasi
      # ==========================================
      - name: Siapkan folder Flask di VM-A
        env:
          SSHPASS: ${{ secrets.PASS_VPS }}

        run: |
          sshpass -e ssh \
            -o StrictHostKeyChecking=no \
            -o PubkeyAuthentication=no \
            vm-a \
            "sudo mkdir -p /opt/level3-flask && sudo chown \$USER:\$USER /opt/level3-flask"


      # ==========================================
      # 7. Upload aplikasi Flask
      # ==========================================
      - name: Upload kode Flask ke VM-A
        env:
          SSHPASS: ${{ secrets.PASS_VPS }}

        run: |
          sshpass -e scp \
            -o StrictHostKeyChecking=no \
            -o PubkeyAuthentication=no \
            skenario1-github-actions-vps-proxycommand/level3-python-flask-release/app/app.py \
            skenario1-github-actions-vps-proxycommand/level3-python-flask-release/app/requirements.txt \
            vm-a:/opt/level3-flask/


      # ==========================================
      # 8. Install dependency
      # ==========================================
      - name: Install dependency Flask
        env:
          SSHPASS: ${{ secrets.PASS_VPS }}

        run: |
          sshpass -e ssh \
            -o StrictHostKeyChecking=no \
            -o PubkeyAuthentication=no \
            vm-a \
            "/opt/level3-flask/venv/bin/pip install -r /opt/level3-flask/requirements.txt"


      # ==========================================
      # 9. Set version dan restart systemd
      # ==========================================
      - name: Set versi & restart service
        env:
          SSHPASS: ${{ secrets.PASS_VPS }}
          RELEASE_VERSION: ${{ steps.ver.outputs.version }}

        run: |
          sshpass -e ssh \
            -o StrictHostKeyChecking=no \
            -o PubkeyAuthentication=no \
            vm-a \
            "
              sudo sed -i 's/^Environment=APP_VERSION=.*/Environment=APP_VERSION=${RELEASE_VERSION}/' /etc/systemd/system/level3-flask.service &&
              sudo systemctl daemon-reload &&
              sudo systemctl restart level3-flask
            "


      # ==========================================
      # 10. Cek status service
      # ==========================================
      - name: Cek status Flask service
        env:
          SSHPASS: ${{ secrets.PASS_VPS }}

        run: |
          sshpass -e ssh \
            -o StrictHostKeyChecking=no \
            -o PubkeyAuthentication=no \
            vm-a \
            "sudo systemctl --no-pager status level3-flask"


      # ==========================================
      # 11. Test Flask dari VM
      # ==========================================
      - name: Test Flask endpoint
        env:
          SSHPASS: ${{ secrets.PASS_VPS }}

        run: |
          sshpass -e ssh \
            -o StrictHostKeyChecking=no \
            -o PubkeyAuthentication=no \
            vm-a \
            "curl -f http://localhost:5000/"
