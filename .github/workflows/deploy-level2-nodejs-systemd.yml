name: "Skenario 1 - Level 2 - Deploy Node.js (systemd)"

on:
  push:
    branches: [ main ]
    paths:
      - 'skenario1-github-actions-vps-proxycommand/level2-nodejs-systemd/app/**'

  workflow_dispatch:
    inputs:
      restart_only:
        description: 'Hanya restart service tanpa upload ulang file?'
        required: true
        type: boolean
        default: false

jobs:
  deploy:
    name: Deploy Node.js app ke VM-A
    runs-on: ubuntu-latest

    steps:
      # ==========================================
      # 1. Checkout repository
      # ==========================================
      - name: Checkout kode
        uses: actions/checkout@v4

      # ==========================================
      # 2. Install cloudflared dan sshpass
      # ==========================================
      - name: Install cloudflared & sshpass
        run: |
          curl -L \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb \
            -o cloudflared.deb

          sudo dpkg -i cloudflared.deb

          sudo apt-get update
          sudo apt-get install -y sshpass

      # ==========================================
      # 3. Konfigurasi SSH
      # ==========================================
      - name: Siapkan SSH config
        env:
          URL_VM: ${{ secrets.URL_VM }}
          USER_VPS: ${{ secrets.USER_VPS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          cat > ~/.ssh/config <<EOF
          Host vm-a
            HostName ${URL_VM}
            User ${USER_VPS}
            ProxyCommand cloudflared access ssh --hostname %h
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            PreferredAuthentications password
            PubkeyAuthentication no
          EOF

          chmod 600 ~/.ssh/config

      # ==========================================
      # 4. Test koneksi SSH
      # ==========================================
      - name: Test koneksi SSH
        env:
          SSHPASS: ${{ secrets.PASS_VPS }}
        run: |
          sshpass -e ssh vm-a "echo 'SSH berhasil terhubung ke VM-A'"

      # ==========================================
      # 5. Upload aplikasi
      # ==========================================
      - name: Upload file aplikasi
        if: ${{ github.event_name == 'push' || github.event.inputs.restart_only != 'true' }}
        env:
          SSHPASS: ${{ secrets.PASS_VPS }}
        run: |
          sshpass -e ssh vm-a "
            sudo mkdir -p /opt/level2-node &&
            sudo chown \$USER:\$USER /opt/level2-node
          "

          sshpass -e scp \
            skenario1-github-actions-vps-proxycommand/level2-nodejs-systemd/app/server.js \
            skenario1-github-actions-vps-proxycommand/level2-nodejs-systemd/app/package.json \
            vm-a:/opt/level2-node/

      # ==========================================
      # 6. Install dependency Node.js
      # ==========================================
      - name: Install dependency Node.js
        if: ${{ github.event_name == 'push' || github.event.inputs.restart_only != 'true' }}
        env:
          SSHPASS: ${{ secrets.PASS_VPS }}
        run: |
          sshpass -e ssh vm-a "
            cd /opt/level2-node &&
            npm install --production
          "

      # ==========================================
      # 7. Restart systemd service
      # ==========================================
      - name: Restart systemd service level2-node
        env:
          SSHPASS: ${{ secrets.PASS_VPS }}
        run: |
          sshpass -e ssh vm-a "
            sudo systemctl daemon-reload &&
            sudo systemctl restart level2-node &&
            sudo systemctl enable level2-node
          "

      # ==========================================
      # 8. Cek status service
      # ==========================================
      - name: Cek status service
        env:
          SSHPASS: ${{ secrets.PASS_VPS }}
        run: |
          sshpass -e ssh vm-a "
            sudo systemctl status level2-node --no-pager
          "
