name: "Skenario 1 - Level 2 - Deploy Node.js (systemd)"

on:
  workflow_dispatch:
    inputs:
      restart_only:
        description: "Hanya restart service tanpa upload ulang file?"
        required: true
        type: boolean
        default: false

jobs:
  deploy:
    name: Deploy Node.js app ke VM-A
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install cloudflared & sshpass
        run: |
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -o cloudflared.deb
          sudo dpkg -i cloudflared.deb
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Siapkan SSH config
        env:
          CF_ACCESS_HOSTNAME: ${{ secrets.URL_VM }}
          VPS_USERNAME: ${{ secrets.USER_VPS }}
        run: |
          mkdir -p ~/.ssh

          cat > ~/.ssh/config <<EOF
          Host vm-a
              HostName ${CF_ACCESS_HOSTNAME}
              User ${VPS_USERNAME}
              ProxyCommand cloudflared access ssh --hostname %h
              StrictHostKeyChecking no
              UserKnownHostsFile /dev/null
          EOF

          chmod 600 ~/.ssh/config

      - name: Upload file aplikasi
        if: ${{ github.event.inputs.restart_only != 'true' }}
        env:
          SSHPASS: ${{ secrets.PASS_VPS }}
        run: |
          sshpass -e ssh vm-a \
            "sudo mkdir -p /opt/level2-node && sudo chown -R \$USER:\$USER /opt/level2-node"

          sshpass -e scp \
            skenario1-github-actions-vps-proxycommand/level2-nodejs-systemd/app/server.js \
            skenario1-github-actions-vps-proxycommand/level2-nodejs-systemd/app/package.json \
            vm-a:/opt/level2-node/

      - name: Install dependencies
        if: ${{ github.event.inputs.restart_only != 'true' }}
        env:
          SSHPASS: ${{ secrets.PASS_VPS }}
        run: |
          sshpass -e ssh vm-a \
            "cd /opt/level2-node && npm install --omit=dev"

      - name: Restart systemd service
        env:
          SSHPASS: ${{ secrets.PASS_VPS }}
        run: |
          sshpass -e ssh vm-a \
            "sudo systemctl restart level2-node && sudo systemctl status level2-node --no-pager"
